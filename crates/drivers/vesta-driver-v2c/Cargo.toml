[package]
name = "vesta-driver-v2c"
description = "VESTA driver for V2C Trydan EV chargers (local HTTP API)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
vesta-core.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["http1", "original-uri", "tokio"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
