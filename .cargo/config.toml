[env]
# TypeScript bindings generated by ts-rs (`cargo test -p vesta-core`).
# The frontend imports API types from here; never hand-write them.
TS_RS_EXPORT_DIR = { value = "web/src/api/generated", relative = true }
# JSON has no bigint: large integers are plain numbers on the wire.
TS_RS_LARGE_INT = "number"
