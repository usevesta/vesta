[workspace]
resolver = "3"
members = [
    "crates/vesta-core",
    "crates/vesta-hub",
    "crates/vesta-drivers",
    "crates/drivers/vesta-driver-sim",
    "crates/drivers/vesta-driver-v2c",
    "crates/drivers/vesta-driver-tuya",
    "apps/hubd",
    "apps/tauri/src-tauri",
    "apps/tauri/plugins/panel",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/usevesta/vesta"
publish = false

[workspace.dependencies]
# Internal crates
vesta-core = { path = "crates/vesta-core" }
vesta-hub = { path = "crates/vesta-hub" }
# Drivers are opt-in per Cargo feature; members enable the ones they need.
vesta-drivers = { path = "crates/vesta-drivers", default-features = false }
vesta-driver-sim = { path = "crates/drivers/vesta-driver-sim" }
vesta-driver-v2c = { path = "crates/drivers/vesta-driver-v2c" }
vesta-driver-tuya = { path = "crates/drivers/vesta-driver-tuya" }
# The app's own Tauri plugin: native Android/iOS code for the panel window.
tauri-plugin-vesta-panel = { path = "apps/tauri/plugins/panel" }

# Shared third-party crates. Members opt into extra features as needed.
# RustCrypto primitives for the Tuya local protocol (AES-128-ECB/GCM,
# HMAC-SHA256); never anything the protocol does not require.
aes = "0.9"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.5"
fastrand = "2.5"
futures-util = { version = "0.3", default-features = false }
# OS CSPRNG for login codes and session ids.
getrandom = "0.3"
hmac = "0.13"
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
percent-encoding = "2.3"
# HTTP client for drivers that talk to devices on the home network (plain
# HTTP on the LAN: no TLS, no proxy, no HTTP/2).
reqwest = { version = "0.13", default-features = false }
# TLS for the one internet service a driver may use (V2C's cloud, only
# when the household saves a charger's hours): rustls with ring (builds on
# every target, Android included) and Mozilla's roots, never the system
# verifier (it needs extra set-up on Android).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
# UDP sockets that share the Tuya discovery ports with other listeners.
socket2 = "0.6"
# Constant-time comparison of login codes and session ids.
subtle = "2.6"
# The app shell (apps/tauri). Keep tauri and tauri-build on the same v2 line
# as `@tauri-apps/cli` / `@tauri-apps/api`.
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
# Build-script helper for the app's own plugins (apps/tauri/plugins).
tauri-plugin = { version = "2.7", features = [] }
# Desktop keep-awake for the panel (IOKit / SetThreadExecutionState / D-Bus).
keepawake = "0.6"
thiserror = "2.0"
tokio = { version = "1.52", default-features = false }
# Test-only WebSocket client; keep in step with the version axum uses.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tower = { version = "0.5", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
ts-rs = { version = "12.0", features = ["serde-json-impl", "jiff-impl"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
